<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Registrar cuidado vacinal')}"></head><body><header th:replace="~{fragments/layout :: header}"></header><main id="conteudo" class="main-content"><section th:replace="~{fragments/layout :: petHeader('vacinas')}"></section><section class="panel form-panel"><a class="back-link" th:href="@{/web/pets/{id}/vacinas(id=${pet.id})}">← Voltar à vacinação</a><p class="eyebrow" th:text="${'Cuidado veterinário · ' + pet.name}"></p><h2 th:text="${vaccineId == null ? 'Registrar vacina' : 'Atualizar vacina'}"></h2><p class="muted">Ao salvar, o PetOS avalia a situação da vacina e sincroniza o alerta preventivo. O resultado aparece na caderneta.</p>
<form th:action="${vaccineId == null} ? @{/web/pets/{p}/vacinas/nova(p=${pet.id})} : @{/web/pets/{p}/vacinas/{v}/editar(p=${pet.id},v=${vaccineId})}" th:object="${form}" method="post"><div th:replace="~{fragments/layout :: errors}"></div>
<label class="field">Nome da vacina *<input th:field="*{name}" required maxlength="100" placeholder="Ex.: Antirrábica"><small class="field-error" th:errors="*{name}"></small></label>
<div class="form-grid"><label class="field">Data de aplicação<input th:field="*{applicationDate}" type="date" th:max="${@view.today()}"><small>Deixe em branco se a dose ainda não foi aplicada.</small><small class="field-error" th:errors="*{applicationDate}"></small></label>
<label class="field">Data de vencimento<input th:field="*{dueDate}" type="date"><small>Opcional. Datas passadas permitem registrar uma dose atrasada. Não pode ser anterior à aplicação.</small><small class="field-error" th:errors="*{dueDate}"></small></label></div>
<div class="form-actions"><a class="button secondary" th:href="@{/web/pets/{id}/vacinas(id=${pet.id})}">Cancelar</a><button class="button">Salvar e avaliar prevenção</button></div></form></section></main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
