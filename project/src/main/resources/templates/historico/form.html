<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Registrar rotina')}"></head><body><header th:replace="~{fragments/layout :: header}"></header><main id="conteudo" class="main-content"><section th:replace="~{fragments/layout :: petHeader('historico')}"></section><section class="panel form-panel"><a class="back-link" th:href="@{/web/pets/{id}/historico(id=${pet.id})}">← Voltar ao histórico</a><p class="eyebrow">O cotidiano também é cuidado</p><h2 th:text="${'Registrar cuidado de ' + pet.name}"></h2><p class="muted">Uma consulta, um passeio ou a medicação: guarde o que já aconteceu para acompanhar a saúde ao longo do tempo.</p>
<form th:action="@{/web/pets/{id}/rotinas/nova(id=${pet.id})}" method="post" th:object="${form}"><div th:replace="~{fragments/layout :: errors}"></div><div class="form-grid"><label class="field">Tipo de cuidado *<select th:field="*{type}" required><option th:each="item : ${types}" th:value="${item}" th:text="${@view.label(item)}"></option></select><small class="field-error" th:errors="*{type}"></small></label><label class="field">Data do cuidado *<input th:field="*{recordDate}" type="date" required th:max="${@view.today()}"><small class="field-error" th:errors="*{recordDate}"></small></label></div>
<label class="field">Observações<textarea th:field="*{description}" rows="4" maxlength="500"></textarea><small>Até 500 caracteres. Não substitui orientação veterinária.</small><small class="field-error" th:errors="*{description}"></small></label><div class="form-actions"><a class="button secondary" th:href="@{/web/pets/{id}/historico(id=${pet.id})}">Cancelar</a><button class="button">Adicionar ao histórico</button></div></form></section></main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
